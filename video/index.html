<!doctype html>
<html lang="es" data-composition-variables='[
  {"id":"desk","type":"string","label":"Captura de escritorio","default":"assets/fracxion-overview.png"},
  {"id":"phone","type":"string","label":"Captura de celular","default":"assets/fracxion-mobile.png"}
]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, height=800" />
  <title>Recorrido de proyecto</title>
  <!-- Video de presentación de cada proyecto para el carrusel del portfolio.
       Sin texto: el mismo video sirve para la versión en español y en inglés.
       El primer y el último cuadro coinciden, así el loop no salta. -->
  <script src="assets/gsap.min.js"></script>
  <style>
    body { margin: 0; background: #000; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .clip { position: absolute; inset: 0; }
    .camera { position: absolute; inset: 0; transform-origin: 50% 50%; }
    .camera img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .shade { position: absolute; inset: 0; background: #000; opacity: 0; }
    .phone-wrap { position: absolute; top: 0; bottom: 0; right: 9%; width: 300px; display: flex; align-items: center; }
    .phone { position: relative; width: 300px; height: 650px; border: 2px solid #fff; border-radius: 34px; overflow: hidden; background: #000; }
    .phone-screen { position: absolute; left: 0; top: 0; width: 100%; }
    .phone-screen img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="800" data-duration="9">
    <section id="desk-scene" class="clip" data-start="0" data-duration="9">
      <div class="camera" id="camera"><img id="desk" data-var-src="desk" src="assets/fracxion-overview.png" alt="" /></div>
      <div class="shade" id="shade"></div>
      <div class="phone-wrap"><div class="phone" id="phone"><div class="phone-screen" id="screen"><img id="phone-img" alt="" /></div></div></div>
    </section>
  </div>
  <script>
    function build() {
      const img = document.getElementById("phone-img");
      const travel = Math.max(0, img.getBoundingClientRect().height - 650);
      const tl = gsap.timeline({ paused: true });
      // Cámara sobre la captura de escritorio: acercar, recorrer y volver al encuadre inicial.
      tl.fromTo("#camera", { scale: 1, xPercent: 0, yPercent: 0 }, { scale: 1.28, xPercent: 9, yPercent: 7, duration: 3, ease: "power2.inOut" }, 0)
        .to("#camera", { xPercent: -7, yPercent: -5, duration: 2.6, ease: "power2.inOut" }, 3)
        .to("#camera", { scale: 1, xPercent: 0, yPercent: 0, duration: 3.4, ease: "power2.inOut" }, 5.6);
      // Celular: entra, recorre la página y sale antes de que termine el loop.
      tl.fromTo("#phone", { x: 520, rotate: 6 }, { x: 0, rotate: 0, duration: 1, ease: "power3.out" }, 2.6)
        .fromTo("#screen", { y: 0 }, { y: -Math.min(travel, 900), duration: 3.6, ease: "power1.inOut" }, 3.4)
        .to("#phone", { x: 520, rotate: -4, duration: 0.9, ease: "power3.in" }, 7.4);
      tl.fromTo("#shade", { opacity: 0 }, { opacity: 0.45, duration: 0.8, ease: "power2.out" }, 2.6)
        .to("#shade", { opacity: 0, duration: 0.9, ease: "power2.in" }, 7.4);
      window.__timelines["main"] = tl;
    }
    // La altura del recorrido depende de la captura del celular: se mide antes de armar el timeline.
    const vars = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
    const phoneImg = document.getElementById("phone-img");
    phoneImg.addEventListener("load", build, { once: true });
    phoneImg.src = vars.phone || "assets/fracxion-mobile.png";
  </script>
</body>
</html>
